# Paper-only hosting budget approved: $25/month. Confirm workspace and source access before applying.
# Never store runtime secrets here.
previews:
  generation: 'off'
services:
  - type: web
    name: tradeomatic-api
    runtime: docker
    autoDeployTrigger: 'off'
    plan: 0.5c-512mb
    region: ohio
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - fromGroup: tradeomatic-private-runtime
      - key: PUBLIC_ORIGIN
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: tradeomatic-db
          property: connectionString
  - type: worker
    name: tradeomatic-monitor
    runtime: docker
    autoDeployTrigger: 'off'
    plan: 0.5c-512mb
    region: ohio
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m backend.supervisor
    numInstances: 1
    envVars:
      - fromGroup: tradeomatic-private-runtime
      - key: PUBLIC_ORIGIN
        fromService:
          name: tradeomatic-api
          type: web
          envVarKey: PUBLIC_ORIGIN
      - key: ENCRYPTION_KEY
        fromService:
          name: tradeomatic-api
          type: web
          envVarKey: ENCRYPTION_KEY
      - key: VAPID_PRIVATE_KEY
        fromService:
          name: tradeomatic-api
          type: web
          envVarKey: VAPID_PRIVATE_KEY
      - key: VAPID_PUBLIC_KEY
        fromService:
          name: tradeomatic-api
          type: web
          envVarKey: VAPID_PUBLIC_KEY
      - key: VAPID_SUBJECT
        fromService:
          name: tradeomatic-api
          type: web
          envVarKey: VAPID_SUBJECT
      - key: DATABASE_URL
        fromDatabase:
          name: tradeomatic-db
          property: connectionString
databases:
  - name: tradeomatic-db
    plan: 0.1c-256mb
    region: ohio
    diskSizeGB: 1
    ipAllowList: []
envVarGroups:
  - name: tradeomatic-private-runtime
    envVars:
      - key: DATA_MODE
        value: demo
      - key: PROVIDER_APPROVED
        value: "false"
      - key: PUSH_ENABLED
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: LEGACY_ADMIN_ENABLED
        value: "false"
      - key: ALLOW_LEGACY_RESEARCH_APPROVALS
        value: "false"
      - key: OANDA_PAPER_APPROVED
        value: "false"
      - key: ALPACA_PAPER_APPROVED
        value: "false"
