services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tradeomatic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: tradeomatic
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeomatic"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tradeomatic:${POSTGRES_PASSWORD}@db/tradeomatic
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      retries: 3
  scanner:
    build: .
    command: ["python", "-m", "backend.supervisor"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tradeomatic:${POSTGRES_PASSWORD}@db/tradeomatic
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
  backups:
    build: .
    command: ["python", "-m", "scripts.encrypted_backup"]
    profiles: ["backups"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://tradeomatic:${POSTGRES_PASSWORD}@db/tradeomatic
      BACKUP_LOOP: "true"
      BACKUP_DIRECTORY: /backups
    volumes: ["./encrypted-backups:/backups"]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
volumes:
  pgdata:
