<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Tradeomatic · Customer preview invitations</title><style>body{background:#0a101a;color:#edf3ff;font:17px system-ui;max-width:700px;margin:50px auto;padding:24px}a{color:#65dfc2}button{padding:14px;background:#65dfc2;border:0;border-radius:8px;font:inherit;cursor:pointer}p{line-height:1.6}#result{overflow-wrap:anywhere}</style><nav aria-label="Platform navigation"><a href="/">← Owner dashboard</a> · <a href="/customers">Customer preview →</a></nav><h1>Customer preview invitations</h1><p>Sign in to your owner account in this browser first. Each invitation allows one customer registration and expires after 24 hours. This preview uses simulated data and a local checkout simulator. No money is charged.</p><button id="create">Create preview invitation</button><p id="result" role="status"></p><script>document.getElementById('create').onclick=async()=>{const out=document.getElementById('result');try{let r=await fetch('/api/v3/session');if(!r.ok)throw Error('Sign in to the owner dashboard first.');const s=await r.json();r=await fetch('/api/customers/admin/invitations',{method:'POST',headers:{'X-CSRF-Token':s.csrf,'Content-Type':'application/json'},body:'{}'});if(!r.ok)throw Error('Invitation could not be created.');const a=await r.json();out.textContent='Private invitation link: '+location.origin+'/customers#invite='+a.invitation;}catch(e){out.textContent=e.message;}};</script></html>
